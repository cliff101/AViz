# Build AViz debug APK on Linux (required by pyside6-android-deploy).
# Trigger manually or push to main. Download the APK from workflow artifacts.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "main.py"
      - "pysidedeploy.spec"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install "PySide6==6.9.1" buildozer==1.5.0 "cython==0.29.33"

      - name: Download Qt for Python Android wheels (aarch64)
        run: |
          mkdir -p wheels
          BASE="https://download.qt.io/official_releases/QtForPython/pyside6"
          VER="6.9.1"
          pip download --no-deps -d wheels \
            "${BASE}/PySide6-${VER}-${VER}-cp311-cp311-android_aarch64.whl" \
            "${BASE}/shiboken6-${VER}-${VER}-cp311-cp311-android_aarch64.whl"

      - name: Download Android NDK and SDK
        run: |
          git clone --depth 1 --branch 6.9 https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python /tmp/pyside-setup/tools/cross_compile_android/main.py \
            --download-only --skip-update --auto-accept-license

      - name: Deploy Android package
        run: |
          WHEEL_PYSIDE=$(ls wheels/PySide6-*-android_aarch64.whl | head -1)
          WHEEL_SHIBOKEN=$(ls wheels/shiboken6-*-android_aarch64.whl | head -1)
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --name aviz \
            --wheel-pyside "$WHEEL_PYSIDE" \
            --wheel-shiboken "$WHEEL_SHIBOKEN" \
            --force \
            --keep-deployment-files \
            -v 2>&1 | tee deploy.log || true
          if [ -f buildozer.spec ]; then
            python android/patch_buildozer.py buildozer.spec
            buildozer android debug 2>&1 | tee buildozer.log
          fi

      - name: Collect APK
        run: |
          APK=$(find . -name "*.apk" -path "*bin*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found. deploy.log / buildozer.log:"
            tail -n 80 deploy.log || true
            tail -n 80 buildozer.log || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/AViz-debug.apk
          echo "APK_PATH=dist/AViz-debug.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: aviz-android-apk
          path: dist/AViz-debug.apk
