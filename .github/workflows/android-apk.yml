# Build AViz debug APK on Linux (required by pyside6-android-deploy).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "main.py"
      - "android_crash.py"
      - "pysidedeploy.spec"
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "android_crash.py"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: "6.10.2"
  PYSIDE_BRANCH: "6.10.2"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin \
            autoconf-archive libltdl-dev pkg-config zlib1g-dev libffi-dev libssl-dev \
            cmake libncurses-dev

      - name: Clone pyside-setup and Python deploy tools
        run: |
          set -euxo pipefail
          git clone --depth 1 -b "${PYSIDE_BRANCH}" \
            https://code.qt.io/pyside/pyside-setup.git /tmp/pyside-setup
          python -m pip install --upgrade pip
          pip install "PySide6==${QT_VERSION}" buildozer==1.5.0 "cython==0.29.33"
          pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          ANDROID_REQ="$(python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'scripts', 'requirements-android.txt'))")"
          pip install -r "${ANDROID_REQ}"
          command -v pyside6-android-deploy

      - name: Download Qt for Python Android wheels (aarch64)
        run: |
          set -euxo pipefail
          mkdir -p wheels
          VER="${QT_VERSION}"
          PYSIDE_BASE="https://download.qt.io/official_releases/QtForPython/pyside6"
          SHIBOKEN_BASE="https://download.qt.io/official_releases/QtForPython/shiboken6"
          curl -fL -o "wheels/PySide6.whl" \
            "${PYSIDE_BASE}/PySide6-${VER}-${VER}-cp311-cp311-android_aarch64.whl"
          curl -fL -o "wheels/shiboken6.whl" \
            "${SHIBOKEN_BASE}/shiboken6-${VER}-${VER}-cp311-cp311-android_aarch64.whl"
          ls -la wheels/

      - name: Download Android NDK and SDK
        run: |
          set -euxo pipefail
          python /tmp/pyside-setup/tools/cross_compile_android/main.py \
            --download-only --skip-update --auto-accept-license
          CACHE="${HOME}/.pyside6_android_deploy"
          test -d "${CACHE}/android-sdk"
          NDK="$(find "${CACHE}/android-ndk" -maxdepth 1 -type d -name 'android-ndk-r*' | head -1)"
          test -n "${NDK}" && test -d "${NDK}"
          echo "ANDROID_SDK=${CACHE}/android-sdk" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK=${NDK}" >> "${GITHUB_ENV}"
          # pageSizeCompat in manifest needs compile SDK 35 (android.api in patch_buildozer.py)
          yes | "${CACHE}/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"

      - name: Generate deployment files
        run: |
          set -euxo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          # Creates buildozer.spec + deployment/; may attempt a build (errors logged).
          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --name aviz \
            --wheel-pyside wheels/PySide6.whl \
            --wheel-shiboken wheels/shiboken6.whl \
            --ndk-path "${ANDROID_NDK}" \
            --sdk-path "${ANDROID_SDK}" \
            --force \
            --keep-deployment-files \
            -v 2>&1 | tee deploy.log || true
          test -f buildozer.spec
          python android/patch_buildozer.py buildozer.spec

      - name: Build APK
        run: |
          set -euxo pipefail
          # Always rebuild after patch_buildozer.py (deploy may have built an APK with
          # Python 3.14 and without pageSizeCompat before the spec was patched).
          bash android/prepare_p4a_build.sh
          buildozer android debug 2>&1 | tee buildozer.log
          APK="$(bash android/find_apk.sh)"
          test -n "${APK}" && test -f "${APK}"
          python android/verify_apk.py "${APK}"
          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"
          ls -la "${APK}"

      - name: Collect APK
        run: |
          set -euxo pipefail
          test -f "${APK_PATH}"
          mkdir -p dist
          cp "${APK_PATH}" dist/AViz-debug.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aviz-android-apk
          path: dist/AViz-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            deploy.log
            buildozer.log
          if-no-files-found: ignore
