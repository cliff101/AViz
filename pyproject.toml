[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviz"
version = "0.1.0"
description = "Premium audio visualization — live spectrum and file spectrograms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
loopback = ["PyAudioWPatch>=0.2.12.6"]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --tb=short -m 'not hardware'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "hardware: tests that need loopback audio playing on speakers (deselect with -m 'not hardware')",
]

[tool.coverage.run]
source = ["aviz"]
omit = ["*/tests/*"]
